# DNS trim to <=3 resolvers — carry-over of scripts/node-image/node-adapt.sh step (2), covering
# constraint C10/C18: glibc caps resolv.conf at 3 nameservers; every hostNetwork pod
# warns above that, and kubelet hands the FULL upstream list from /run/systemd/resolve/resolv.conf
# to pods with dnsPolicy=Default. Ubuntu needed a netplan-specific drop-in; on GL this is a plain
# drop-in for the server feature's /etc/systemd/network/99-default.network (systemd-networkd +
# systemd-resolved are GL's resolver stack — no netplan exists here).
# Static Hetzner anycast recursors (valid in every Hetzner region), all dynamic DNS sources off
# so the count stays deterministic at 3 (DHCPv4 + DHCPv6 + RA/RDNSS would push it to 4+).
[Network]
DNS=
DNS=185.12.64.1
DNS=185.12.64.2
DNS=2a01:4ff:ff00::add:1

[DHCPv4]
UseDNS=false

[DHCPv6]
UseDNS=false

[IPv6AcceptRA]
UseDNS=false
