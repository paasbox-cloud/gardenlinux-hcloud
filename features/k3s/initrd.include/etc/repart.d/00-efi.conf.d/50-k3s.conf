# k3s flavors (_usi): cap the ESP's growth. The _usi definition (00-efi.conf, Weight=1, min 1G) lets
# the ESP take a weighted share of every free byte; with the vg0 partition below also at Weight=1
# the two would split the disk's remainder evenly, and half of it would be an ESP. 4G holds the A/B
# UKIs gardenlinux-update keeps with room to spare. Drop-in, so the vendored file stays untouched.
# Only in the initrd of flavors with the k3s element — the gardener flavors' ESP is unchanged.
[Partition]
SizeMaxBytes=4G
