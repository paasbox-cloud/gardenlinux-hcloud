# k3s flavors (_usi): /var is a FIXED-size area, the rest of the disk is vg0 (20-vg0.conf).
#
# /var holds k3s' datastore, containerd's images and the logs — it persists across A/B image updates
# (the root is an EROFS inside the UKI on the ESP; /var is its own partition, and /etc is an overlay
# whose upper layer is in /var). Its weight (15, from _nocrypt's 10-var.conf) is far above vg0's (1),
# so /var fills first up to this cap and vg0 gets everything after it: a 40G disk is ESP 4G + /var 24G
# + vg0 12G, an 80G disk ESP 4G + /var 24G + vg0 52G; on a disk below ~30G /var takes most of it
# and vg0 is small. repart never shrinks an existing partition, so changing this later only affects
# new nodes.
[Partition]
SizeMaxBytes=24G
