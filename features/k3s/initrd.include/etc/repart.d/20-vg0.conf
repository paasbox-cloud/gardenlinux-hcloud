# k3s flavors (_usi): the remainder of the disk as one partition for LVM, labelled vg0.
# k3s-vg0.service turns it into the PV of volume group vg0 on first boot (pvcreate/vgcreate only if
# absent) — the same VG name as the dedicated pool's installimage layout
# (pool-manager/pkg/reimage/disklayout.go), so the same StorageClasses work on both.
#
# No Format=: repart leaves the partition raw, and LVM owns it. Last on the disk and without a max
# size, so when the disk grows (hcloud rescale with disk), repart grows this partition on the next
# boot and k3s-vg0.service's pvresize hands the space to vg0.
[Partition]
Type=e6d6d379-f507-44c2-a23c-238f2a3df928
Label=vg0
Weight=1
