# k3s prerequisites. k3s.service also modprobes the first two in ExecStartPre; loading them at boot
# lets systemd-sysctl apply the bridge-nf sysctls in 90-k3s.conf, which need br_netfilter present.
overlay
br_netfilter
nf_conntrack
# LocalPV-LVM's node plugin runs lvcreate INSIDE its container, which has no /lib/modules, so lvm's
# own `modprobe dm-thin-pool` fails there and a thin volume is refused with "thin: Required
# device-mapper target(s) not detected in your kernel" (measured 2026-09-23 on the first boot of this
# image). The host has to have the targets loaded before the first PVC.
dm_thin_pool
dm_snapshot
