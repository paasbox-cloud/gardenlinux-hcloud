# Thin-pool overbooking protection — the same policy nodepool-core's nodePrepare applies on the
# dedicated pool (pool-manager docs/local-storage.md §4). Thin volumes allocate as they are written,
# so vg0's thin pool fills without any volume changing size, and a full pool turns every volume in it
# read-only. Extend at 80 % by 20 %; dmeventd (lvm2-monitor.service, k3s-thinpool-monitor.timer)
# is what notices the threshold. Autoextend only buys time: it consumes vg0's free extents.
activation {
    monitoring = 1
    thin_pool_autoextend_threshold = 80
    thin_pool_autoextend_percent = 20
}
