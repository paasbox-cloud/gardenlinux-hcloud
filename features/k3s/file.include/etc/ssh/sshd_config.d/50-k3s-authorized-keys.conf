# k3s nodes: besides ~/.ssh/authorized_keys, read /etc/ssh/authorized_keys.d/<user>. On _usi /root is
# a tmpfs and /etc is persistent (an overlay on /var), so this is where a key survives a reboot —
# k3s-persist-root-keys.service copies cloud-init's delivered keys here. Key-only as everywhere.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
