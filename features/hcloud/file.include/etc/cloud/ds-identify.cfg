# Always run cloud-init (Gardener's OSC provision script arrives as user_data and MUST run);
# runtime datasource selection stays with datasource_list in 50-datasource.cfg. Unlike the
# openstack feature we do NOT force `datasource:` here, so the NoCloud fallback stays usable
# for local QEMU boots. ds-identify detects Hetzner via DMI sys_vendor (dscheck_Hetzner).
policy: enabled
