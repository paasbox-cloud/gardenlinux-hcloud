# hcloud key-delivery convention is ROOT: the platform vendor-data sets
# system_info.default_user.name=root (verified GL1 boot test 2026-07-07), so cloud-init
# delivers the hcloud-injected ssh key to /root/.ssh/authorized_keys. With the (default)
# disable_root: true, cc_ssh prefixes that key with a login-refusing command= — i.e. the
# platform-delivered key can never work. Key-only root login is the hcloud norm (Hetzner's
# stock images behave this way); password logins stay impossible (lock_passwd +
# sshd PermitRootLogin prohibit-password, see exec.config).
# Gardener nodes keep sshd DISABLED by preset regardless — this only governs deliberate
# debug access. CAVEAT (USI variant): /root is a tmpfs there, so the delivered key survives
# only until reboot (cc_ssh is once-per-instance); persistent access goes via Gardener OSC.
disable_root: false
