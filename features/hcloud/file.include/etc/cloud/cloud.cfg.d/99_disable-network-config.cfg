# Networking is owned by systemd-networkd (GL server feature: 99-default.network, DHCP on
# en*/eth*), NOT by cloud-init — mirrors the upstream aws feature. This deliberately kills the
# MAC-pinned-render class of failures (Ubuntu/netplan shoot-nbg incident 2026-07-06): a
# hot-attached hcloud private NIC is matched by name and DHCPs immediately, no stale pin possible.
network: {config: disabled}
