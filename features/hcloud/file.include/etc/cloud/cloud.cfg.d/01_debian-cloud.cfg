# NOTE: no default_user block here (the upstream openstack feature ships one for user `admin`).
# On hcloud it is DEAD CONFIG: Hetzner's metadata vendor-data pins
# `system_info.default_user.name: root` (verified on a live boot, GL1 2026-07-07) and
# vendor-data outranks /etc/cloud config — the injected ssh key always lands on root.
# Root-login enablement lives in 60-hcloud-root-access.cfg + exec.config.
# new-style apt key: the flat apt_preserve_sources_list is deprecated since cloud-init 22.1
# and made `cloud-init status` report "degraded" on the GL1 boot test (2026-07-07).
apt:
  preserve_sources_list: true
manage_etc_hosts: true
