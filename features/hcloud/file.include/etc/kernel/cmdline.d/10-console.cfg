# Modeled on features/kvm's console snippet (hcloud VMs are KVM/QEMU). Ordering differs from
# kvm on purpose: tty0 LAST so /dev/console lands on the display — the hcloud web "Console" is
# noVNC on the VGA device, and there is no user-reachable serial port on Hetzner Cloud. Serial
# stays first for completeness (earlycon + hypothetical debugging).
serial_dev=ttyS0
earlycon="earlyprintk=$serial_dev,115200n8"
extra_console=""

if [ "$(arch)" = aarch64 ]; then
	# CAX (arm64). A BARE `earlycon`: the kernel takes the UART from ACPI SPCR (or the device tree's
	# stdout-path), so it finds the PL011 wherever the machine has one. The address used to be
	# hard-coded (earlycon=pl011,mmio,0x09000000 — QEMU virt's), and on a machine with nothing there,
	# Apple Virtualization.framework (vz), the kernel hung before any console
	# (verified 2026-09-23: the image did not boot on vz until earlycon was removed).
	# console=hvc0 is the virtio console vz provides; harmless where there is none. tty0 stays last.
	serial_dev=ttyAMA0
	earlycon="earlycon"
	extra_console="console=hvc0"
fi

CMDLINE_LINUX="$earlycon console=$serial_dev ${extra_console:+$extra_console }console=tty0 $CMDLINE_LINUX"
